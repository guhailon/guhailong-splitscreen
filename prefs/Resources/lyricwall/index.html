    <style>

    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: #17112b;
        color: #f4efff;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      /* Ambient blurred backdrop (desktop / tall screens): the current cover, blurred */
      .ambient { position: fixed; inset: 0; overflow: hidden; background: #17112b; }
      .ambient img {
        width: 100%; height: 100%; object-fit: cover;
        filter: blur(46px) saturate(1.25) brightness(.62);
        transform: scale(1.25);
        transition: opacity .8s ease;
      }
      .ambient::after {
        content: ""; position: absolute; inset: 0;
        background: radial-gradient(120% 90% at 50% 30%, transparent 40%, rgba(10,6,24,.55) 100%);
      }
      .page {
        position: relative; z-index: 1;
        min-height: 100vh; min-height: 100dvh;
        display: flex; align-items: center; justify-content: center;
      }
      /* ---------- 9:16 stage ---------- */
      .stage {
        position: relative;
        width: min(100vw, calc(100dvh * 9 / 16));
        height: min(100dvh, calc(100vw * 16 / 9));
        display: flex; flex-direction: column;
        background: #1d1540;
        overflow: hidden;
        border-radius: 30px;
        box-shadow: 0 30px 90px rgba(5,2,18,.65), 0 0 0 1px rgba(255,255,255,.09);
      }
      @media (max-width: 560px) {
        .stage { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
      }
      /* ---------- Cover ---------- */
      .cover {
        position: relative; flex: 0 0 35%; overflow: hidden; background: #241a4e;
      }
      .cover img.photo {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        animation: kenburns 26s ease-in-out infinite alternate;
        transition: opacity .45s ease;
      }
      @keyframes kenburns { from { transform: scale(1.02); } to { transform: scale(1.12) translateY(-1.5%); } }
      .cover-shade {
        position: absolute; inset: 0; pointer-events: none;
        background:
          linear-gradient(180deg, rgba(38,24,84,.18) 0%, transparent 30%, transparent 62%, rgba(29,21,64,.88) 100%),
          linear-gradient(0deg, rgba(214,164,205,.14), transparent 45%);
      }
      .cover-meta { position: absolute; left: 18px; bottom: 14px; pointer-events: none; text-shadow: 0 2px 14px rgba(20,8,50,.75); }
      .cover-song {
        font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 600;
        font-size: clamp(17px, 4.6vw, 21px); letter-spacing: .02em; color: #fff;
      }
      .cover-artist { margin-top: 3px; font-size: 12px; letter-spacing: .14em; color: rgba(240,232,255,.85); }
      .change-cover {
        position: absolute; right: 14px; bottom: 12px;
        display: inline-flex; align-items: center; gap: 6px;
        min-height: 38px; padding: 8px 13px;
        border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
        background: rgba(30,20,66,.42); color: #fff;
        font-size: 13px; letter-spacing: .06em; cursor: pointer;
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      }
      .change-cover:active { transform: scale(.96); }
      .change-cover svg { width: 17px; height: 17px; flex: none; }
      /* Cover picker sheet */
      .cover-sheet {
        position: absolute; left: 10px; right: 10px; bottom: 10px;
        padding: 14px 14px 12px; border-radius: 20px;
        background: rgba(24,16,52,.82);
        border: 1px solid rgba(255,255,255,.14);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        display: none;
      }
      .cover-sheet.open { display: block; animation: sheetUp .28s ease; }
      @keyframes sheetUp { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .cover-sheet h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; letter-spacing: .12em; color: rgba(240,232,255,.9); }
      .cover-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
      .cover-opt {
        position: relative; padding: 0; border: 2px solid transparent; border-radius: 12px;
        overflow: hidden; cursor: pointer; background: #2c2060; aspect-ratio: 1 / 1; min-height: 44px;
      }
      .cover-opt img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .cover-opt.sel { border-color: #e9b8dd; }
      .cover-opt.upload {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
        color: rgba(240,232,255,.92); font-size: 11px; letter-spacing: .05em;
        background: rgba(255,255,255,.07); border: 1.5px dashed rgba(255,255,255,.35);
      }
      .cover-opt.upload svg { width: 20px; height: 20px; }
      .sheet-close {
        position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; min-height: 36px;
        border: none; border-radius: 50%; background: rgba(255,255,255,.1); color: #fff;
        font-size: 16px; cursor: pointer; line-height: 1;
      }
      /* ---------- Player ---------- */
      .player { position: relative; flex: 1 1 auto; overflow: hidden; background: #1d1540; }
      #gl { position: absolute; inset: 0; }
      #gl canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .player-top {
        position: absolute; top: 0; left: 0; right: 0; padding: 14px 16px 26px;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(23,15,52,.55), transparent);
      }
      .badge {
        display: inline-block; padding: 4px 10px; border-radius: 999px;
        border: 1px solid rgba(233,184,221,.5); color: #f3cfec;
        font-size: 11px; letter-spacing: .22em; background: rgba(35,22,74,.35);
      }
      .player-title {
        margin-top: 9px; font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 600;
        font-size: clamp(19px, 5.4vw, 24px); line-height: 1.15; color: #fff;
        text-shadow: 0 2px 16px rgba(16,6,44,.8);
      }
      .player-artist { margin-top: 4px; font-size: 12.5px; letter-spacing: .16em; color: rgba(238,230,255,.82); }
      .player-note { margin-top: 5px; font-size: 11px; letter-spacing: .08em; color: rgba(238,230,255,.68); text-shadow: 0 1px 8px rgba(16,6,44,.85); }
      .big-play {
        position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
        width: 86px; height: 86px; min-height: 86px; border-radius: 50%;
        border: 1.5px solid rgba(255,255,255,.55);
        background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.34), rgba(88,64,160,.38) 68%);
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 12px 44px rgba(10,4,34,.5), 0 0 0 10px rgba(255,255,255,.05);
        transition: opacity .35s ease, transform .35s ease;
        animation: pulse 2.6s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100% { box-shadow: 0 12px 44px rgba(10,4,34,.5), 0 0 0 8px rgba(255,255,255,.05);} 50% { box-shadow: 0 12px 44px rgba(10,4,34,.5), 0 0 0 16px rgba(255,255,255,.02);} }
      .big-play svg { width: 34px; height: 34px; margin-left: 5px; }
      .big-play.hidden { opacity: 0; pointer-events: none; transform: translate(-50%, -50%) scale(.82); animation: none; }
      .tap-hint {
        position: absolute; left: 0; right: 0; bottom: 108px; text-align: center;
        font-size: 12px; letter-spacing: .3em; color: rgba(240,234,255,.66);
        text-shadow: 0 1px 10px rgba(10,4,34,.9); pointer-events: none;
        transition: opacity .6s ease;
      }
      .tap-hint.dim { opacity: .38; }
      /* Control bar */
      .controls {
        position: absolute; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom));
        padding: 12px 14px 10px; border-radius: 20px;
        background: rgba(22,14,50,.58);
        border: 1px solid rgba(255,255,255,.12);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      }
      .seek-row { display: flex; align-items: center; gap: 10px; }
      .seek-row .t { font-size: 11.5px; font-variant-numeric: tabular-nums; color: rgba(240,234,255,.85); min-width: 32px; }
      .seek-row .t:last-child { text-align: right; }
      input[type="range"].seek {
        flex: 1; -webkit-appearance: none; appearance: none; height: 36px; min-height: 36px;
        background: transparent; cursor: pointer; margin: 0;
      }
      .seek::-webkit-slider-runnable-track { height: 4px; border-radius: 2px;
        background: linear-gradient(90deg, #e9b8dd var(--fill, 0%), rgba(255,255,255,.22) var(--fill, 0%)); }
      .seek::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
        background: #fff; margin-top: -5.5px; box-shadow: 0 0 10px rgba(233,184,221,.9); border: none; }
      .seek::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(255,255,255,.22); }
      .seek::-moz-range-progress { height: 4px; border-radius: 2px; background: #e9b8dd; }
      .seek::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%; background: #fff; border: none; box-shadow: 0 0 10px rgba(233,184,221,.9); }
      .btn-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 2px; }
      .cbtn {
        width: 46px; height: 46px; min-height: 46px; border-radius: 50%;
        border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06);
        color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
      }
      .cbtn:active { transform: scale(.93); }
      .cbtn svg { width: 20px; height: 20px; }
      .cbtn.main { width: 58px; height: 58px; min-height: 58px; background: linear-gradient(145deg, #f0c4e6, #9a7fd4); border: none; box-shadow: 0 8px 26px rgba(154,127,212,.5); }
      .cbtn.main svg { width: 24px; height: 24px; }
      .btn-spacer { flex: 1; }
      .loop-tag { font-size: 11px; letter-spacing: .18em; color: rgba(240,234,255,.55); padding-right: 2px; }
      .playlist-open {
        position: absolute; right: 14px; top: 12px; z-index: 6;
        display: inline-flex; align-items: center; gap: 5px;
        min-height: 34px; padding: 6px 12px;
        border: 1px solid rgba(255,255,255,.28); border-radius: 999px;
        background: rgba(30,20,66,.42); color: #fff; font-size: 12.5px; letter-spacing: .08em;
        cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        pointer-events: auto;
      }
      .playlist-open:active { transform: scale(.96); }
      .playlist-sheet {
        position: absolute; left: 12px; right: 12px; bottom: 118px; z-index: 8;
        padding: 14px 14px 10px; border-radius: 20px;
        background: rgba(24,16,52,.88);
        border: 1px solid rgba(255,255,255,.14);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        display: none;
      }
      .playlist-sheet.open { display: block; animation: sheetUp .28s ease; }
      .playlist-sheet h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; letter-spacing: .12em; color: rgba(240,232,255,.9); }
      .track-row {
        display: flex; align-items: center; gap: 10px; width: 100%;
        padding: 10px; margin-bottom: 6px; border-radius: 14px;
        border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05);
        color: #fff; text-align: left; cursor: pointer;
      }
      .track-row.cur { border-color: #e9b8dd; background: rgba(233,184,221,.14); }
      .track-num { font-family: Georgia, serif; font-style: italic; font-size: 15px; color: rgba(240,232,255,.75); min-width: 18px; text-align: center; }
      .track-info { flex: 1; min-width: 0; }
      .track-name { font-weight: 600; font-size: 13.5px; }
      .track-sub { margin-top: 2px; font-size: 11px; letter-spacing: .08em; color: rgba(238,230,255,.65); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .track-tag { font-size: 10.5px; letter-spacing: .1em; padding: 3px 8px; border-radius: 999px; border: 1px solid rgba(233,184,221,.5); color: #f3cfec; white-space: nowrap; }
      .track-tag.wait { border-color: rgba(255,255,255,.25); color: rgba(240,232,255,.6); }
      .track-row.import-row { border-style: dashed; border-color: rgba(233,184,221,.45); background: rgba(233,184,221,.06); }
      .import-sheet {
        position: absolute; left: 12px; right: 12px; bottom: 118px; z-index: 9;
        padding: 14px; border-radius: 20px; max-height: 62vh; overflow-y: auto;
        background: rgba(24,16,52,.92); border: 1px solid rgba(255,255,255,.14);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        display: none;
      }
      .import-sheet.open { display: block; animation: sheetUp .28s ease; }
      .import-sheet h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .12em; color: rgba(240,232,255,.9); }
      .import-hint { margin: 0 0 10px; font-size: 12px; line-height: 1.6; color: rgba(238,230,255,.72); }
      .src-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
      .src-btn { padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.06); color: #fff; font-size: 12.5px; cursor: pointer; }
      .src-btn.cur { border-color: #e9b8dd; background: rgba(233,184,221,.2); }
      .import-title, .import-area {
        width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 9px 10px;
        border-radius: 12px; border: 1px solid rgba(255,255,255,.18);
        background: rgba(0,0,0,.28); color: #fff; font-size: 13px; line-height: 1.55;
      }
      .import-area { resize: vertical; min-height: 110px; }
      .import-title::placeholder, .import-area::placeholder { color: rgba(240,232,255,.45); }
      .import-actions { display: flex; align-items: center; gap: 8px; }
      .file-btn { padding: 8px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.07); color: #fff; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
      .import-do { padding: 8px 14px; border-radius: 999px; border: none; background: linear-gradient(145deg, #f0c4e6, #9a7fd4); color: #fff; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
      .import-status { margin: 8px 0 0; min-height: 16px; font-size: 12px; line-height: 1.5; color: rgba(243,207,236,.9); }
      #errBox {
        position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 50; display: none;
        padding: 12px 14px; border-radius: 12px; background: rgba(80,16,32,.92); color: #ffe9ee;
        font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
      }
      @media (prefers-reduced-motion: reduce) {
        .cover img.photo { animation: none; }
        .big-play { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="ambient" aria-hidden="true"><img id="ambientImg" src="assets/cover-eyes.webp" alt="" /></div>
    <div class="page">
      <main class="stage" id="stage">
        <!-- ===== 封面区 ===== -->
        <section class="cover" aria-label="封面">
          <img class="photo" id="coverImg" src="assets/cover-eyes.webp" alt="梦幻封面：星空眼眸与蝴蝶" />
          <div class="cover-shade"></div>
          <div class="cover-meta">
            <div class="cover-song">The Truth That You Leave</div>
            <div class="cover-artist">PIANOBOY · 高至豪</div>
          </div>
          <button class="change-cover" id="changeCoverBtn" type="button" aria-haspopup="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6" fill="currentColor" stroke="none"/><path d="M3 17.5 9.5 11l3.5 3.5 3-3L21 16.5"/></svg>
            更换封面
          </button>
          <div class="cover-sheet" id="coverSheet" role="dialog" aria-label="选择封面">
            <h3>更换封面</h3>
            <button class="sheet-close" id="sheetClose" type="button" aria-label="关闭">✕</button>
            <div class="cover-grid">
              <button class="cover-opt sel" type="button" data-cover="assets/cover-eyes.webp" aria-label="封面：星空眼眸"><img src="assets/cover-eyes.webp" alt="" /></button>
              <button class="cover-opt" type="button" data-cover="assets/cover-lake.webp" aria-label="封面：湖畔钢琴"><img src="assets/cover-lake.webp" alt="" /></button>
              <button class="cover-opt" type="button" data-cover="assets/cover-keys.webp" aria-label="封面：水面琴键"><img src="assets/cover-keys.webp" alt="" /></button>
              <label class="cover-opt upload" role="button" aria-label="从相册选择封面">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 16V5m0 0-4 4m4-4 4 4"/><path d="M4 17v1.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V17"/></svg>
                相册
                <input id="coverUpload" type="file" accept="image/*" hidden />
              </label>
            </div>
          </div>
        </section>
        <!-- ===== 播放器 ===== -->
        <section class="player" aria-label="播放器">
          <div id="gl"></div>
          <div class="player-top">
            <span class="badge">3D 水面立体歌词墙</span>
            <div class="player-title">The Truth That You Leave</div>
            <div class="player-artist">PIANOBOY 高至豪 · 纯音乐钢琴</div>
            <div class="player-note">本曲为纯音乐 · 墙上文字为配乐意境创作，非原曲歌词</div>
          </div>
          <button class="playlist-open" id="playlistBtn" type="button" aria-haspopup="true">☰ 歌单</button>
          <button class="big-play" id="bigPlay" type="button" aria-label="播放">
            <svg viewBox="0 0 24 24" fill="#fff"><path d="M7 4.8c0-1.1 1.2-1.8 2.2-1.3l11 6.7c.9.6.9 1.9 0 2.5l-11 6.7c-1 .6-2.2-.1-2.2-1.3V4.8z"/></svg>
          </button>
          <div class="tap-hint" id="tapHint">轻 点 水 面 · 泛 起 涟 漪</div>
          <div class="playlist-sheet" id="playlistSheet" role="dialog" aria-label="歌单">
            <h3>歌单</h3>
            <button class="sheet-close" id="playlistClose" type="button" aria-label="关闭">✕</button>
            <div id="trackList"></div>
            <button class="track-row import-row" id="importRow" type="button">
              <span class="track-num">＋</span>
              <span class="track-info"><span class="track-name">导入歌词</span><br/>
              <span class="track-sub">从 QQ音乐 / 网易云音乐 / 抖音 / 其他 APP 导入</span></span>
              <span class="track-tag">导入</span>
            </button>
          </div>
          <div class="import-sheet" id="importSheet" role="dialog" aria-label="导入歌词">
            <h3>导入歌词</h3>
            <button class="sheet-close" id="importClose" type="button" aria-label="关闭">✕</button>
            <p class="import-hint">分屏插件读不到别的 APP 的私有歌词文件。先在那个 APP 里复制歌词（或分享出 .lrc 文件），再到这里粘贴或选文件导入。</p>
            <div class="src-row" id="srcRow">
              <button type="button" class="src-btn cur" data-src="QQ音乐">QQ音乐</button>
              <button type="button" class="src-btn" data-src="网易云音乐">网易云音乐</button>
              <button type="button" class="src-btn" data-src="抖音">抖音</button>
              <button type="button" class="src-btn" data-src="其他 APP">其他 APP</button>
            </div>
            <input class="import-title" id="importTitle" type="text" placeholder="歌名（不填就用文件名）" maxlength="60" />
            <textarea class="import-area" id="importArea" rows="6" placeholder="在这里粘贴歌词……&#10;支持带时间戳的 .lrc（[00:12.34]歌词），&#10;没有时间戳就按行平分 30 秒。"></textarea>
            <div class="import-actions">
              <label class="file-btn" for="importFile">选 .lrc / .txt 文件</label>
              <input id="importFile" type="file" accept=".lrc,.txt,text/plain" style="display:none" />
              <span class="btn-spacer"></span>
              <button class="import-do" id="importDo" type="button">导入进歌单</button>
            </div>
            <p class="import-status" id="importStatus"></p>
          </div>
          <div class="controls">
            <div class="seek-row">

    <script>
      (function () {
        var errBox = document.getElementById('errBox');

        });

        /* ================= 数据：意象词句（纯音乐 · 随琴声流动的文字） ================= */
        var TRACKS = [
          { title: 'The Truth That You Leave', artist: 'PIANOBOY 高至豪 · 纯音乐钢琴',
            note: '本曲为纯音乐 · 墙上文字为配乐意境创作，非原曲歌词',
            cover: 'assets/cover-eyes.webp', audio: 'file', src: 'assets/piano.m4a',
            lines: [
              { en: 'The truth that you leave',        zh: '你留下的真相',        dur: 5.2 },
              { en: 'falls like rain on quiet keys',   zh: '像雨，落在安静的琴键上', dur: 5.2 },
              { en: 'Every note you never played',     zh: '每一个你未弹出的音符',   dur: 5.0 },
              { en: 'still echoes through the trees',  zh: '仍在林间轻轻回响',      dur: 5.0 },
              { en: 'I trace your name on water',      zh: '我在水面上描摹你的名字', dur: 5.2 },
              { en: 'but the ripples wash it free',    zh: '涟漪却将它缓缓带走',    dur: 5.0 },
              { en: 'If goodbye is all you owe me',    zh: '若告别是你欠我的全部',   dur: 5.2 },
              { en: 'leave it soft, leave it true',    zh: '请留得温柔，留得真实',   dur: 5.0 },
              { en: 'The truth that you leave behind', zh: '你留在身后的真相',      dur: 5.2 },
              { en: 'is the song I keep of you',       zh: '是我为你留存的歌',      dur: 5.6 }
            ] },
          { title: '待加入', artist: '等皇上指定歌',
            note: '这首歌还没加 · 等皇上指定歌名再放进来',
            cover: 'assets/cover-lake.webp', audio: 'synth', src: null,
            lines: [
              { en: 'A song waiting to be named',      zh: '一首还在等名字的歌',   dur: 5.0 },
              { en: 'Tell me which song to add next',  zh: '告诉我下一首加哪首歌', dur: 5.0 },
              { en: 'The water keeps flowing',         zh: '水面还在轻轻流淌',    dur: 5.0 }
            ] },
          { title: '待加入', artist: '等皇上指定歌',
            note: '这首歌还没加 · 等皇上指定歌名再放进来',
            cover: 'assets/cover-keys.webp', audio: 'synth', src: null,
            lines: [
              { en: 'An empty slot on the wall',        zh: '墙上一个空着的位置',   dur: 5.0 },
              { en: 'Waiting for your next pick',       zh: '等你挑下一首歌',      dur: 5.0 },
              { en: 'The ripples remember',             zh: '涟漪会记得',          dur: 5.0 }
            ] }
        ];
        var currentTrack = 0;
        var LINES = TRACKS[0].lines;
        var STARTS = [], TOTAL = 0;
        function computeStarts() {
          STARTS = []; TOTAL = 0;
          LINES.forEach(function (l) { STARTS.push(TOTAL); TOTAL += l.dur; });
        }
        computeStarts();

        /* ================= 播放状态 ================= */
        var playing = false;
        var currentTime = 0;
        var lastActive = -1;

        function fmt(s) {
          s = Math.max(0, Math.floor(s));
          return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
        }
        document.getElementById('tTot').textContent = fmt(TOTAL);

        function lineAt(t) {
          for (var i = LINES.length - 1; i >= 0; i--) if (t >= STARTS[i]) return i;
          return 0;
        }
        function flowAt(t) {
          var i = lineAt(t), f = (t - STARTS[i]) / LINES[i].dur;
          f = Math.min(1, Math.max(0, f));
          var e = f * f * (3 - 2 * f);           // smoothstep
          return i + e * 0.92;                    // 缓缓流向下一句
        }

        /* ================= 封面切换 ================= */
        var coverImg = document.getElementById('coverImg');
        var ambientImg = document.getElementById('ambientImg');
        var sheet = document.getElementById('coverSheet');
        var uploadedURL = null;
        function setCover(src) {
          coverImg.style.opacity = '0';
          var pre = new Image();
          pre.onload = function () {
            coverImg.src = src; ambientImg.src = src;
            coverImg.style.opacity = '1';
          };
          pre.src = src;
          document.querySelectorAll('.cover-opt[data-cover]').forEach(function (b) {
            b.classList.toggle('sel', b.getAttribute('data-cover') === src);
          });
        }
        document.getElementById('changeCoverBtn').addEventListener('click', function () {
          sheet.classList.toggle('open');
        });
        document.getElementById('sheetClose').addEventListener('click', function () {
          sheet.classList.remove('open');
        });
        document.querySelectorAll('.cover-opt[data-cover]').forEach(function (b) {
          b.addEventListener('click', function () {
            setCover(b.getAttribute('data-cover'));
            sheet.classList.remove('open');
          });
        });
        document.getElementById('coverUpload').addEventListener('change', function (ev) {
          var f = ev.target.files && ev.target.files[0];
          if (!f) return;
          if (uploadedURL) URL.revokeObjectURL(uploadedURL);
          uploadedURL = URL.createObjectURL(f);
          document.querySelectorAll('.cover-opt[data-cover]').forEach(function (b) { b.classList.remove('sel'); });
          setCover(uploadedURL);
          sheet.classList.remove('open');
        });

        /* ================= 音乐：真实音频文件为主，WebAudio 合成兜底 =================
           主通道走 <audio> 媒体播放：iOS 上 WebAudio 会被静音开关压制、
           合成音量也偏小，所以钢琴曲已渲染成 assets/piano.m4a 直接播放；
           文件加载/播放失败时才回退到下面的 WebAudio 实时合成。 */
        var bgm = document.getElementById('bgm');
        var useSynth = false;
        function startBgm() {
          if (useSynth) { ensureAudio(); if (AC && AC.state === 'suspended') AC.resume(); return; }
          var p = bgm.play();
          if (p && p.catch) p.catch(function () {
            useSynth = true;
            ensureAudio();
            if (AC && AC.state === 'suspended') AC.resume();
          });
        }
        function stopBgm() {
          try { bgm.pause(); } catch (e) {}
          if (AC && AC.state === 'running') AC.suspend();
        }
        bgm.addEventListener('error', function () { useSynth = true; }, true);

        /* ================= WebAudio 合成钢琴（兜底） ================= */
        var AC = null, master = null, wet = null, schedTimer = null, nextNoteTime = 0, stepIdx = 0;
        function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
        var CHORDS = [
          { root: 50, tones: [62, 66, 69, 76] },  // Dmaj9
          { root: 47, tones: [59, 62, 66, 73] },  // Bm9
          { root: 43, tones: [55, 59, 62, 69] },  // Gmaj9
          { root: 45, tones: [57, 61, 64, 71] }   // Aadd9
        ];
        var PENTA = [74, 76, 78, 81, 83, 86];
        var melIdx = 2;
        function makeImpulse(ctx, dur, decay) {
          var rate = ctx.sampleRate, len = rate * dur;
          var buf = ctx.createBuffer(2, len, rate);
          for (var c = 0; c < 2; c++) {
            var d = buf.getChannelData(c);
            for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
          }
          return buf;
        }
        function piano(freq, t, vel, dur) {
          var g = AC.createGain();
          var flt = AC.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = 2600; flt.Q.value = 0.4;
          var o1 = AC.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq;
          var o2 = AC.createOscillator(); o2.type = 'triangle'; o2.frequency.value = freq * 2;
          var g2 = AC.createGain(); g2.gain.value = 0.32;
          var o3 = AC.createOscillator(); o3.type = 'sine'; o3.frequency.value = freq * 3;
          var g3 = AC.createGain(); g3.gain.value = 0.1;
          o1.connect(g); o2.connect(g2); g2.connect(g); o3.connect(g3); g3.connect(g);
          g.connect(flt); flt.connect(master); flt.connect(wet);
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(vel, t + 0.006);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o1.start(t); o2.start(t); o3.start(t);
          o1.stop(t + dur + 0.1); o2.stop(t + dur + 0.1); o3.stop(t + dur + 0.1);
        }
        function pad(freq, t, dur) {
          var g = AC.createGain();
          var flt = AC.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = 750;
          [0, 4, -3].forEach(function (det) {
            var o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = freq; o.detune.value = det;
            o.connect(g); o.start(t); o.stop(t + dur + 0.5);
          });
          g.connect(flt); flt.connect(master);
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.045, t + 1.6);
          g.gain.setValueAtTime(0.045, t + dur - 1.2);
          g.gain.linearRampToValueAtTime(0, t + dur);
        }
        function scheduler() {
          if (!AC) return;
          var STEP = 0.6, BAR = 8; // 每小节 8 步 × 0.6s = 4.8s，一个和弦
          while (nextNoteTime < AC.currentTime + 0.7) {
            var bar = Math.floor(stepIdx / BAR), s = stepIdx % BAR;
            var ch = CHORDS[bar % CHORDS.length];
            if (s === 0) {
              piano(mtof(ch.root), nextNoteTime, 0.3, 3.6); // 低音根音
              ch.tones.forEach(function (m) { pad(mtof(m - 12), nextNoteTime, BAR * STEP); });
            }
            var pat = [0, 1, 2, 3, 2, 3, 1, 2];
            piano(mtof(ch.tones[pat[s]]), nextNoteTime, 0.19, 2.4);
            if (s % 2 === 0 && Math.random() < 0.55) {
              melIdx = Math.max(0, Math.min(PENTA.length - 1, melIdx + (Math.random() < 0.5 ? -1 : 1) * (Math.random() < 0.25 ? 2 : 1)));
              piano(mtof(PENTA[melIdx]), nextNoteTime + 0.05, 0.13, 3.4);
            }
            nextNoteTime += STEP;
            stepIdx++;
          }
        }
        function blip() {
          if (!AC || AC.state !== 'running') return;
          var t = AC.currentTime;
          var o = AC.createOscillator(); o.type = 'sine';
          o.frequency.setValueAtTime(640, t);
          o.frequency.exponentialRampToValueAtTime(170, t + 0.4);
          var g = AC.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
          o.connect(g); g.connect(master); g.connect(wet);
          o.start(t); o.stop(t + 0.5);
        }
        function ensureAudio() {
          if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
          var Ctor = window.AudioContext || window.webkitAudioContext;
          if (!Ctor) return;
          AC = new Ctor();
          master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
          var conv = AC.createConvolver(); conv.buffer = makeImpulse(AC, 2.4, 2.6);
          wet = AC.createGain(); wet.gain.value = 0.5;
          wet.connect(conv); conv.connect(master);
          nextNoteTime = AC.currentTime + 0.15; stepIdx = 0;
          schedTimer = setInterval(scheduler, 240);
        }

        /* ================= Three.js 场景 ================= */
        var container = document.getElementById('gl');
        var renderer;
        try {
          renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        } catch (e) {
          errBox.style.display = 'block';
          errBox.textContent = '这台设备不支持 WebGL，水面歌词墙没法流动起来。';
          throw e;
        }
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.06;
        container.appendChild(renderer.domElement);

        var scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x453372, 16, 44);
        var camera = new THREE.PerspectiveCamera(55, 9 / 16, 0.1, 120);
        camera.position.set(0, 2.05, 8.4);

        var composer = null;
        try {
          composer = new THREE.EffectComposer(renderer);
          composer.addPass(new THREE.RenderPass(scene, camera));
          var bloom = new THREE.UnrealBloomPass(new THREE.Vector2(540, 960), 0.38, 0.55, 0.8);
          composer.addPass(bloom);
          composer.addPass(new THREE.OutputPass());
        } catch (e) { composer = null; }

        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var elapsed = 0;

        /* ---- 天空穹顶 ---- */
        var dome = new THREE.Mesh(
          new THREE.SphereGeometry(58, 32, 20),
          new THREE.ShaderMaterial({
            side: THREE.BackSide, depthWrite: false, fog: false,
            uniforms: { uTime: { value: 0 } },
            vertexShader: [
              'varying vec3 vDir;',
              'void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }'
            ].join('\n'),
            fragmentShader: [
              'varying vec3 vDir; uniform float uTime;',
              'float hash(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,45.164))) * 43758.5453); }',
              'void main(){',
              '  float h = clamp(vDir.y, -0.12, 1.0);',
              '  vec3 top = vec3(0.11, 0.08, 0.27);',
              '  vec3 mid = vec3(0.33, 0.24, 0.57);',
              '  vec3 hor = vec3(0.76, 0.54, 0.77);',
              '  vec3 col = mix(hor, mid, smoothstep(0.0, 0.28, h));',
              '  col = mix(col, top, smoothstep(0.24, 0.75, h));',
              '  vec3 cell = floor(vDir * 90.0);',
              '  float s = hash(cell);',
              '  float tw = 0.5 + 0.5 * sin(uTime * 1.6 + s * 40.0);',
              '  float star = step(0.9975, s) * tw * smoothstep(0.08, 0.4, h);',
              '  col += star * vec3(1.0, 0.95, 1.0) * 0.85;',
              '  gl_FragColor = vec4(col, 1.0);',
              '}'
            ].join('\n')
          })
        );
        scene.add(dome);

        /* ---- 月亮光晕 ---- */
        function glowTexture(inner, outer) {
          var c = document.createElement('canvas'); c.width = c.height = 256;
          var g = c.getContext('2d');
          var gr = g.createRadialGradient(128, 128, 8, 128, 128, 128);
          gr.addColorStop(0, inner); gr.addColorStop(1, outer);
          g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
          var t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
        }
        var moonGlow = new THREE.Sprite(new THREE.SpriteMaterial({
          map: glowTexture('rgba(255,240,255,0.95)', 'rgba(200,160,255,0)'),
          transparent: true, opacity: 0.34, blending: THREE.AdditiveBlending, depthWrite: false, fog: false
        }));
        moonGlow.position.set(10.5, 11.5, -36); moonGlow.scale.set(13, 13, 1);
        scene.add(moonGlow);
        var moonCore = new THREE.Sprite(new THREE.SpriteMaterial({
          map: glowTexture('rgba(255,255,255,1)', 'rgba(255,230,250,0)'),
          transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, depthWrite: false, fog: false
        }));
        moonCore.position.copy(moonGlow.position); moonCore.scale.set(3.4, 3.4, 1);
        scene.add(moonCore);

        /* ---- 水面 ---- */
        var MAXR = 10;
        var rippleData = [];
        for (var ri = 0; ri < MAXR; ri++) rippleData.push(new THREE.Vector4(0, 0, -100, 0));
        var rippleCursor = 0;
        var waterUniforms = {
          uTime: { value: 0 },
          uRipples: { value: rippleData },
          uFogColor: { value: new THREE.Color(0x453372) },
          uFogNear: { value: 16 }, uFogFar: { value: 44 }
        };
        var waterMat = new THREE.ShaderMaterial({
          uniforms: waterUniforms,
          vertexShader: [
            'uniform float uTime;',
            'uniform vec4 uRipples[' + MAXR + '];',
            'varying vec3 vWorld;',
            'varying vec3 vNormalW;',
            'varying float vRing;',
            'float waveH(vec2 p, float t, out float ring){',
            '  float h = 0.0; ring = 0.0;',
            '  h += sin(p.x * 0.32 + t * 0.9) * 0.13;',
            '  h += sin(p.y * 0.27 - t * 0.7) * 0.11;',
            '  h += sin((p.x + p.y) * 0.115 + t * 0.45) * 0.17;',
            '  h += sin(p.x * 1.35 - t * 1.5) * 0.028;',
            '  h += sin(p.y * 1.7 + t * 1.15) * 0.022;',
            '  for (int i = 0; i < ' + MAXR + '; i++) {',
            '    vec4 r = uRipples[i];',
            '    float age = t - r.z;',
            '    if (age < 0.0 || age > 4.0 || r.w <= 0.0) continue;',
            '    float d = length(p - r.xy);',
            '    float front = exp(-pow(d - age * 1.7, 2.0) * 1.6);',
            '    float w = sin(d * 7.0 - age * 8.5) * front * exp(-age * 0.85) * 0.16 * r.w;',
            '    h += w; ring += abs(w) * 2.4;',
            '  }',
            '  return h;',
            '}',
            'void main(){',
            '  vec4 wp = modelMatrix * vec4(position, 1.0);',
            '  float ring0;',
            '  float h = waveH(wp.xz, uTime, ring0);',
            '  float e = 0.38; float rx, rz;',
            '  float hx = waveH(wp.xz + vec2(e, 0.0), uTime, rx);',
            '  float hz = waveH(wp.xz + vec2(0.0, e), uTime, rz);',
            '  wp.y += h;',
            '  vNormalW = normalize(vec3(-(hx - h) / e, 1.0, -(hz - h) / e));',
            '  vWorld = wp.xyz; vRing = ring0;',
            '  gl_Position = projectionMatrix * viewMatrix * wp;',
            '}'
          ].join('\n'),
          fragmentShader: [
            'uniform float uTime;',
            'uniform vec3 uFogColor; uniform float uFogNear; uniform float uFogFar;',
            'varying vec3 vWorld; varying vec3 vNormalW; varying float vRing;',
            'float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
            'void main(){',
            '  vec3 V = normalize(cameraPosition - vWorld);',
            '  vec3 N = normalize(vNormalW);',
            '  float fres = pow(1.0 - max(dot(V, N), 0.0), 2.1);',
            '  vec3 deep = vec3(0.055, 0.04, 0.16);',
            '  vec3 skyc = vec3(0.44, 0.33, 0.70);',
            '  vec3 pink = vec3(0.88, 0.58, 0.78);',
            '  vec3 col = mix(deep, skyc, clamp(fres * 0.88 + 0.04, 0.0, 1.0));',
            '  col = mix(col, pink, pow(fres, 3.0) * 0.38);',
            '  float fd = length(cameraPosition - vWorld);',
            '  vec2 cell = floor(vWorld.xz * 15.0);',
            '  float hs = hash(cell);',
            '  float tw = 0.5 + 0.5 * sin(uTime * 2.2 + hs * 44.0);',
            '  float sp = step(0.992, hs) * tw * smoothstep(2.5, 7.0, fd);',
            '  col += sp * vec3(1.0, 0.92, 1.0) * (0.15 + fres * 0.55);',
            '  col += vRing * vec3(0.95, 0.85, 1.0) * 0.55;',
            '  float ff = smoothstep(uFogNear, uFogFar, fd);',
            '  col = mix(col, uFogColor, ff);',
            '  gl_FragColor = vec4(col, 1.0);',
            '}'
          ].join('\n')
        });
        var water = new THREE.Mesh(new THREE.PlaneGeometry(90, 90, 150, 150), waterMat);
        water.rotation.x = -Math.PI / 2;
        scene.add(water);

        function spawnRipple(x, z, amp) {
          rippleData[rippleCursor].set(x, z, elapsed, amp);
          rippleCursor = (rippleCursor + 1) % MAXR;
        }

        /* ---- 歌词立体字 ---- */
        function makeLyricTexture(line) {
          var c = document.createElement('canvas'); c.width = 1024; c.height = 264;
          var g = c.getContext('2d');
          g.clearRect(0, 0, 1024, 264);
          g.textAlign = 'center'; g.textBaseline = 'middle';
          var size = 100;

        /* ---- 蝴蝶 ---- */
        function butterflyTexture() {

        var bTex = butterflyTexture();

        /* ---- 布局与动画 ---- */
        function layoutLyrics(flow) {
          for (var i = 0; i < lyricObjs.length; i++) {
            var o = lyricObjs[i];
            var d = i - flow;
            var x, y, z, scale, op;
            if (d >= 0) {
              z = 1.7 - d * 2.25;

        /* ================= 歌单切换 =================

        /* ================= 导入歌词：四个来源（QQ音乐／网易云音乐／抖音／其他 APP） =================
           查到的结论（2026-11-22）：三个 APP 的歌词都不在本地留 .lrc 文件——QQ音乐走
           c.y.qq.com 在线取（base64／QRC 需解密），网易云走官方 API 回 JSON（lrc.lyric），

        function escHtml(s) {
          return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        var importSource = 'QQ音乐';

        function mkImportLine(text, dur) {
          var t = String(text);
          if (/[\u4e00-\u9fff]/.test(t)) {
            if (t.length > 24) t = t.slice(0, 24) + '…';
            return { en: '', zh: t, dur: dur };

          return { en: t, zh: '', dur: dur };
        }
        function parseLyrics(text) {
          var rawLines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
          var metaRe = /^\[(ti|ar|al|au|by|offset|length|re|ve|#)[^\]]*\]\s*$/i;
          var timeRe = /\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/g;

            }

            if (times.length && rest) timed.push({ start: times[0], text: rest });
            else if (!times.length) plain.push(line);
          });
          var lines = [];
          if (timed.length >= 2) {
            timed.sort(function (a, b) { return a.start - b.start; });

              if (!(dur > 0)) dur = 2;
              if (dur > 20) dur = 20;
              lines.push(mkImportLine(it.text, dur));

            lines.push(mkImportLine(timed[0].text, 5));

            var n = Math.min(plain.length, 40);
            if (!n) return null;
            var per = 30 / n;
            for (var i = 0; i < n; i++) lines.push(mkImportLine(plain[i], per));
          }

        }
        function addImportedTrack() {

        }
        document.getElementById('importRow').addEventListener('click', function () {

          var f = ev.target.files && ev.target.files[0];

          rd.onload = function () {
            document.getElementById('importArea').value = rd.result || '';
            var titleEl = document.getElementById('importTitle');
            if (!titleEl.value.replace(/^\s+|\s+$/g, '')) {

        });
        document.getElementById('importDo').addEventListener('click', addImportedTrack);

        /* ================= 播放控制 ================= */
        var bigPlay = document.getElementById('bigPlay');
        var playIcon = document.getElementById('playIcon');
        var pauseIcon = document.getElementById('pauseIcon');
        var tapHint = document.getElementById('tapHint');
        function setPlaying(on) {
          playing = on;
          if (on) {
            startBgm();
            bigPlay.classList.add('hidden');
            tapHint.classList.add('dim');
          } else {
            stopBgm();
            bigPlay.classList.remove('hidden');
          }
          playIcon.style.display = on ? 'none' : '';
          pauseIcon.style.display = on ? '' : 'none';
          document.getElementById('playBtn').setAttribute('aria-label', on ? '暂停' : '播放');
        }
        bigPlay.addEventListener('click', function () { setPlaying(true); spawnRipple(0, 1.8, 1.0); });
        document.getElementById('playBtn').addEventListener('click', function () { setPlaying(!playing); });
        document.getElementById('prevBtn').addEventListener('click', function () {
          loadTrack(currentTrack - 1);
        });
        document.getElementById('nextBtn').addEventListener('click', function () {
          loadTrack(currentTrack + 1);
        });
        var seekEl = document.getElementById('seek');
        seekEl.addEventListener('input', function () {
          currentTime = seekEl.value / 1000 * TOTAL;
          lastActive = -1;
          seekEl.style.setProperty('--fill', (seekEl.value / 10) + '%');
          document.getElementById('tCur').textContent = fmt(currentTime);
        });
      })();
    </script>
  </body>
</html>
