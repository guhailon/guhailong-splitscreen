# macOS 云端编译：顾海龙集团分屏 v1.0.28
# 做法照抄 FrontBoardAppLauncher 的 .github/workflows/build.yml
# （Apache-2.0，macOS runner + Theos + iOS 16.5 SDK + ldid），
# 改成编 tweak 的 .deb（rootless）。推代码就自动跑；跑完在
# 该次运行的 Artifacts 里下载
# com.guhailong.splitscreen_1.0.28_iphoneos-arm64.deb。
# 不需要任何密钥（Secret），不需要 Mac。
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Checkout theos/theos
        uses: actions/checkout@main
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Checkout theos/sdks
        uses: actions/checkout@main
        with:
          repository: theos/sdks
          ref: master
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Ensure main utils are installed
        uses: dhinakg/procursus-action@main
        with:
          packages: coreutils make xz ldid

      - name: Build
        run: |
          export THEOS=theos
          gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless STRIP=0

      - name: Verify .deb
        run: |
          ls -la packages/
          dpkg-deb -I packages/*.deb
          dpkg-deb -c packages/*.deb | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@main
        with:
          name: com.guhailong.splitscreen_1.0.28_iphoneos-arm64
          path: packages/*.deb
